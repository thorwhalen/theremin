# wads CI - calls the reusable workflow hosted in i2mint/wads.
#
# All configuration comes from this repo's pyproject.toml [tool.wads.ci.*]:
# python versions, pytest args, excluded paths, linting, build and publish.
# To customize the workflow itself (rare), replace this file with the full
# inline template `wads/data/github_ci_uv.yml` from i2mint/wads.
#
# Pinning: `@master` floats with wads. CI failure does not block a published
# release - it blocks the publish step itself - so floating master is safe here.
#
# Permissions: GitHub validates that the caller grants AT LEAST the permissions
# any job in the called workflow requests, at workflow-parse time (even for jobs
# that would be skipped via `if:`). The reusable workflow needs:
#   contents: write   for the publish job's version-bump push-back, and for the
#                     github-pages job's gh-pages branch push
#   pages: write      for the github-pages job's REST API Pages configuration
# Both default to `write` on org-account GITHUB_TOKEN and must be granted
# explicitly on personal-account callers, where the default is read-only.
name: Continuous Integration
on: [push, pull_request]
jobs:
  ci:
    uses: i2mint/wads/.github/workflows/uv-ci.yml@master
    permissions:
      contents: write
      pages: write
    # Explicit pass-through rather than `secrets: inherit`, which does not
    # reliably propagate a caller repo's secrets to a reusable workflow owned by
    # a different account (personal-account caller + i2mint-org workflow).
    #
    # This repo needs no secrets to build or test; PYPI_PASSWORD is used only by
    # the publish job, which runs on the default branch. Listing names one by one
    # (rather than the WADS_CI_SECRETS_JSON blob transport, also supported by the
    # reusable workflow) keeps the secret surface to exactly what is needed.
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
